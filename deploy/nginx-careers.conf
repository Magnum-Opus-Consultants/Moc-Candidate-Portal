# careers.moc-pty.com
#
# nginx is the only thing listening publicly. It terminates TLS and splits
# traffic: Django owns /api/, /admin/, /static/ and /media/; Next.js owns
# everything else.
#
# certbot --nginx rewrites the listen/ssl lines below and adds the
# redirect from :80. Run it after this file is in place.

server {
    listen 80;
    listen [::]:80;
    server_name careers.moc-pty.com;

    # certbot replaces this with a redirect to HTTPS once a certificate
    # is issued. Until then it serves the ACME challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name careers.moc-pty.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/careers.moc-pty.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/careers.moc-pty.com/privkey.pem;

    # A CV is a few hundred KB; a phone photo can be several MB. The API
    # caps uploads itself, but nginx would reject them first at its 1MB
    # default and the candidate would see a bare 413.
    client_max_body_size 12M;

    access_log /var/log/nginx/careers.access.log;
    error_log  /var/log/nginx/careers.error.log;

    # Django. X-Forwarded-Proto is what lets Django know the original
    # request was HTTPS — without it SECURE_SSL_REDIRECT loops forever.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Uploaded CVs and photos. Served by nginx, not Django, which only
    # serves them in DEBUG.
    location /media/ {
        alias /srv/moc-portal/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Uploaded files are never executed or inlined.
        add_header X-Content-Type-Options "nosniff";
    }

    location /static/ {
        alias /srv/moc-portal/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js build output is content-hashed, so it can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams suspended content, so it must not be buffered.
        proxy_buffering off;
    }
}
